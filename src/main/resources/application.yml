server:
  error:
    include-message: always
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/nasaosam}
    username: ${DB_USERNAME:nasaosam}
    password: ${DB_PASSWORD:nasaosam}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
management:
  endpoints:
    web:
      exposure:
        include: health
app:
  hmac-secret: ${HMAC_SECRET:dev-hmac-tajna-samo-za-lokalni-razvoj-12345}
  jwt-secret: ${JWT_SECRET:dev-tajna-samo-za-lokalni-razvoj-1234567890}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}